name: Scanner checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the HA amd64 image
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.22 -t amazon-scanner:test amazon_price_scanner
      - name: Scanner regression tests
        run: docker run --rm --entrypoint /opt/venv/bin/python -v "$PWD/tests:/tests:ro" -v "$PWD/amazon_price_scanner:/amazon_price_scanner:ro" amazon-scanner:test -m unittest discover -s /tests -v
      - name: Chromium smoke test as scanner user
        run: |
          docker run --rm --entrypoint su-exec -e HOME=/tmp amazon-scanner:test scanner /opt/venv/bin/python -c '
          import re
          from browser_client import BrowserClient
          client = BrowserClient("it", "it", "session-id=test", re.compile("session-id"), "/tmp/scanner")
          try:
              client.driver.get("data:text/html,<title>scanner smoke test</title><h1>ready</h1>")
              assert client.driver.title == "scanner smoke test"
              print("Chromium", client.driver.capabilities["browserVersion"], "OK")
          finally:
              client.close()
          '
